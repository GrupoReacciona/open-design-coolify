name: open-design

services:
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-docker.io/vanjayak/open-design:latest}
    restart: always
    expose:
      - "7456"
    environment:
      SERVICE_FQDN_OPEN_DESIGN:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${SERVICE_URL_OPEN_DESIGN:-}
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_API_TOKEN: ${OD_API_TOKEN}
      OD_BASICAUTH_USERS: ${OD_BASICAUTH_USERS}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
    labels:
      # Declares the Basic Auth middleware. To activate it on the router,
      # see README.md Step 5 (requires the Coolify-generated router name).
      - "traefik.http.middlewares.od-basicauth.basicauth.users=${OD_BASICAUTH_USERS}"
    volumes:
      - open_design_data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
